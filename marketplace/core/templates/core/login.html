<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        a:hover {
            cursor: pointer;
        }
    </style>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>

<body class="bg-light">
    <div class="row d-flex justify-content-center aign-items-center my-4 p-5">
        <div class="col-4 rounded-4 bg-white my-4 p-5 shadow-sm">
            <h1 class="mb-6 mb-4">Login</h1>

            {% if form.errors or form.non_field_errors %}
            <div class="mb-3 bg-danger rounded text-white">
                {% for field in form %}
                {{ field.errors }}
                {% endfor %}

                {{ form.non_field_errors }}
            </div>
            {% endif %}

            <form method="post" action=".">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="inline-block mb-2">Username</label><br>
                    {{ form.username }}
                </div>

                <div class="mb-3">
                    <label class="inline-block mb-2">Password</label><br>
                    {{ form.password }}
                </div>

                <button class="mt-3 btn btn-dark">Submit</button>

                <div class="mt-3">
                    <p>Don't have an account? <a href="{% url 'core:signup' %}"
                            class="link-primary link-underline-opacity-25 link-underline-opacity-100-hover">Signup</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
