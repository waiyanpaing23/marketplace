{% extends 'core/base.html' %}

{% block title %}Inbox{% endblock %}

{% block content %}
<div class="container p-5" style="min-height: 500px;">
    <div class="row">
        <div class="col-8 offset-2">
            <h2 class="mb-4">Conversation</h2>

            {% for message in conversation.messages.all %}
            <div class="{% if message.created_by == request.user %} bg-primary-subtle {% else %} bg-secondary-subtle {% endif %} px-3 py-2 mb-2 rounded">
                <p class="mb-4"><strong>@ {{ message.created_by.username }}</strong><span class="text-muted">{{ message.created_at }}</span></p>
                <p>{{ message.content }}</p>
            </div>
            {% endfor %}

            <form action="." method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-dark">Send</button>
            </form>

        </div>
    </div>
</div>
{% endblock %}
